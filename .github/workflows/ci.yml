name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: pytest --cov=plcforge --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy

  examples:
    name: Translate and run the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The examples are part of the contract: if they stop translating cleanly,
      # the README is lying.
      - name: Every example parses without a diagnostic
        run: plcforge --strict check examples --summary

      - name: Structured Text to Python
        run: plcforge convert examples/scl -t python -o build/python --name conveyor

      - name: Ladder and FBD to Structured Text
        run: |
          plcforge convert examples/plcopen/MotorStarter.ld.xml -t st -o build/st
          plcforge convert examples/plcopen/TankControl.fbd.xml -t st -o build/st
          cat build/st/*.st

      - name: Python back to Structured Text
        run: plcforge lift examples/python/pump_controller.py -o build/st/PumpStation.st

      - name: Scaffold a project and run its tests
        run: |
          plcforge scaffold plant --from examples/scl -o build/plant
          cd build/plant
          python -m pip install -e ".[dev]"
          pytest -q
          python -m plant.main --cycles 100

      - name: Compile the C++ translation
        run: |
          plcforge convert examples/scl -t cpp -o build/cpp --name conveyor
          cat > build/cpp/main.cpp <<'CPP'
          #include "conveyor.hpp"
          #include <cstdio>
          int main() {
              plcforge::SimulatedClock sim;
              plcforge::set_clock(&sim);
              plant::ConveyorLine line;
              plcforge::ScanEngine engine(line, 0.05);
              line.lineEnable = true;
              line.rawSpeedPot = 13824;
              engine.run_cycles(45, &sim);
              std::printf("state=%d speed=%.3f\n",
                          static_cast<int>(line.infeed.state), line.infeed.speed);
              return line.infeed.speed > 1.3 ? 0 : 1;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -O2 build/cpp/main.cpp -Ibuild/cpp -o build/cpp/demo
          ./build/cpp/demo

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
